<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standort-Alarme</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #6b7280;
    --line: #e2e5ea; --accent: #03a9f4; --accent-text: #ffffff;
    --ok: #2e9e5b; --warn: #e59a00; --danger: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1c1f26; --text: #e6e8eb; --muted: #9aa1ad;
      --line: #2c313b; --accent: #03a9f4; --accent-text: #00121c;
      --ok: #4cc27f; --warn: #f0b429; --danger: #ef6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  h2 { font-size: 13px; margin: 24px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  select, input[type=text] {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 10px; border: 0; background: var(--bg); color: var(--text);
    font: inherit; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 22px; cursor: pointer;
  }
  .stepper .n { min-width: 48px; text-align: center; font-size: 24px; font-weight: 700; }
  .primary {
    width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 700; cursor: pointer;
  }
  .primary:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .rule { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .rule.paused { opacity: .6; }
  .rule.done { opacity: .55; }
  .rule-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .rule-name { font-weight: 600; }
  .rule-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .badge {
    flex: none; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
  }
  .badge.done { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.paused { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .actions button {
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
  }
  .actions button.del { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 18px; }
  .log { font-size: 13px; color: var(--muted); }
  .log div { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .log div:last-child { border-bottom: 0; }
  .err { color: var(--danger); font-size: 13px; margin-top: 10px; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📍 Standort-Alarme</h1>

  <div class="card">
    <label for="entity">Wenn dieses Gerät / diese Person …</label>
    <select id="entity"></select>

    <label>… folgendes tut</label>
    <div class="seg" id="eventSeg">
      <button type="button" data-v="enter" class="on">betritt</button>
      <button type="button" data-v="leave">verlässt</button>
    </div>

    <label for="zone">Zone</label>
    <select id="zone"></select>

    <label for="notify">Benachrichtigung senden an</label>
    <select id="notify"></select>

    <label>Wie oft?</label>
    <div class="stepper">
      <button type="button" id="minus">−</button>
      <div class="n" id="count">2</div>
      <button type="button" id="plus">+</button>
      <span class="hint" style="margin:0">danach löscht sich die Regel selbst</span>
    </div>

    <details>
      <summary>Text anpassen (optional)</summary>
      <label for="title">Titel</label>
      <input type="text" id="title" placeholder="Standort-Alarm">
      <label for="message">Nachricht</label>
      <input type="text" id="message" placeholder="{person} hat {zone} {event}">
      <div class="hint">Platzhalter: {person}, {zone}, {event} (betreten/verlassen)</div>
      <label for="name">Name der Regel</label>
      <input type="text" id="name" placeholder="wird automatisch erzeugt">
    </details>

    <button class="primary" id="create">Regel erstellen</button>
    <div class="err" id="err"></div>
  </div>

  <h2>Aktiv</h2>
  <div id="active"></div>

  <h2 id="doneHead" style="display:none">Erledigt <button class="link" id="clearDone">alle entfernen</button></h2>
  <div id="done"></div>

  <h2>Verlauf</h2>
  <div class="card log" id="log"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let opts = { entities: [], zones: [], notify: [] };
let event = "enter";
let count = 2;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function api(path, method = "GET", body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Fehler " + res.status);
  return data;
}

function fillSelect(sel, items, empty) {
  sel.textContent = "";
  if (!items.length) {
    const o = el("option", "", empty);
    o.value = "";
    sel.appendChild(o);
    return;
  }
  items.forEach((i) => {
    const o = el("option", "", i.name);
    o.value = i.id;
    sel.appendChild(o);
  });
}

function selectedName(sel) {
  return sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : "";
}

function fmtTime(ts) {
  if (!ts) return "";
  return new Date(ts * 1000).toLocaleString("de-DE", {
    day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit",
  });
}

function ruleCard(r) {
  const done = r.remaining <= 0;
  const paused = !done && r.enabled === false;
  const card = el("div", "rule" + (done ? " done" : "") + (paused ? " paused" : ""));
  const top = el("div", "rule-top");
  const left = el("div");
  left.appendChild(el("div", "rule-name", r.name));
  const verb = r.event === "enter" ? "betritt" : "verlässt";
  left.appendChild(el("div", "rule-sub",
    `${r.entity_name} ${verb} ${r.zone_name} → ${r.notify_name}`));
  if (r.last_triggered) left.appendChild(el("div", "rule-sub", "Zuletzt: " + fmtTime(r.last_triggered)));
  top.appendChild(left);
  const badge = el("div", "badge" + (done ? " done" : paused ? " paused" : ""),
    done ? "fertig" : paused ? "pausiert" : `noch ${r.remaining}× von ${r.total}`);
  top.appendChild(badge);
  card.appendChild(top);

  const actions = el("div", "actions");
  if (!done) {
    const t = el("button", "", paused ? "▶ Fortsetzen" : "⏸ Pausieren");
    t.onclick = async () => render(await api(`api/rules/${r.id}/toggle`, "POST"));
    actions.appendChild(t);
  }
  const test = el("button", "", "Test senden");
  test.onclick = async () => {
    try { await api(`api/rules/${r.id}/test`, "POST"); test.textContent = "Gesendet ✓"; }
    catch (e) { alert(e.message); }
  };
  actions.appendChild(test);
  const del = el("button", "del", "Löschen");
  del.onclick = async () => render(await api(`api/rules/${r.id}`, "DELETE"));
  actions.appendChild(del);
  card.appendChild(actions);
  return card;
}

function render(state) {
  const active = $("active"), done = $("done"), log = $("log");
  active.textContent = ""; done.textContent = ""; log.textContent = "";
  const a = state.rules.filter((r) => r.remaining > 0);
  const d = state.rules.filter((r) => r.remaining <= 0);
  if (!a.length) active.appendChild(el("div", "empty", "Keine aktiven Regeln"));
  a.forEach((r) => active.appendChild(ruleCard(r)));
  d.forEach((r) => done.appendChild(ruleCard(r)));
  $("doneHead").style.display = d.length ? "" : "none";
  if (!state.log.length) log.appendChild(el("div", "", "Noch nichts passiert"));
  state.log.slice(0, 15).forEach((l) => log.appendChild(el("div", "", `${fmtTime(l.ts)} – ${l.text}`)));
}

async function refresh() {
  try { render(await api("api/rules")); } catch (e) { /* nächster Versuch */ }
}

async function init() {
  try {
    opts = await api("api/options");
  } catch (e) {
    $("err").textContent = "Home Assistant nicht erreichbar: " + e.message;
  }
  fillSelect($("entity"), opts.entities, "Keine Geräte gefunden");
  fillSelect($("zone"), opts.zones, "Keine Zonen gefunden");
  fillSelect($("notify"), opts.notify, "Keine Notify-Dienste gefunden");
  await refresh();
  setInterval(refresh, 5000);
}

document.querySelectorAll("#eventSeg button").forEach((b) => {
  b.onclick = () => {
    event = b.dataset.v;
    document.querySelectorAll("#eventSeg button").forEach((x) => x.classList.toggle("on", x === b));
  };
});
$("minus").onclick = () => { count = Math.max(1, count - 1); $("count").textContent = count; };
$("plus").onclick = () => { count = Math.min(99, count + 1); $("count").textContent = count; };

$("create").onclick = async () => {
  $("err").textContent = "";
  const entity = $("entity").value, zone = $("zone").value, notify = $("notify").value;
  if (!entity || !zone || !notify) { $("err").textContent = "Bitte alle Felder auswählen."; return; }
  $("create").disabled = true;
  try {
    const state = await api("api/rules", "POST", {
      entity, entity_name: selectedName($("entity")),
      zone, zone_name: selectedName($("zone")),
      notify, notify_name: selectedName($("notify")),
      event, count,
      title: $("title").value, message: $("message").value, name: $("name").value,
    });
    render(state);
    $("name").value = ""; $("message").value = ""; $("title").value = "";
  } catch (e) {
    $("err").textContent = e.message;
  } finally {
    $("create").disabled = false;
  }
};

$("clearDone").onclick = async () => render(await api("api/clear-done", "POST"));

init();
</script>
</body>
</html>
