<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location alerts</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #6b7280;
    --line: #e2e5ea; --accent: #03a9f4; --accent-text: #ffffff;
    --ok: #2e9e5b; --warn: #e59a00; --danger: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1c1f26; --text: #e6e8eb; --muted: #9aa1ad;
      --line: #2c313b; --accent: #03a9f4; --accent-text: #00121c;
      --ok: #4cc27f; --warn: #f0b429; --danger: #ef6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  h2 { font-size: 13px; margin: 24px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  select, input[type=text] {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 10px; border: 0; background: var(--bg); color: var(--text);
    font: inherit; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 22px; cursor: pointer;
  }
  .stepper .n { min-width: 48px; text-align: center; font-size: 24px; font-weight: 700; }
  .primary {
    width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 700; cursor: pointer;
  }
  .primary:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .rule { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .rule.paused { opacity: .6; }
  .rule.done { opacity: .55; }
  .rule-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .rule-name { font-weight: 600; }
  .rule-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .badge {
    flex: none; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
  }
  .badge.done { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.paused { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .actions button {
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
  }
  .actions button.del { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 18px; }
  .log { font-size: 13px; color: var(--muted); }
  .log div { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .log div:last-child { border-bottom: 0; }
  .err { color: var(--danger); font-size: 13px; margin-top: 10px; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">📍 Location alerts</h1>

  <div class="card">
    <label id="entityLabel" for="entity">If this device/person …</label>
    <select id="entity"></select>

    <label id="eventLabel">… does the following</label>
    <div class="seg" id="eventSeg">
      <button type="button" data-v="enter" class="on">enters</button>
      <button type="button" data-v="leave">leaves</button>
    </div>

    <label id="zoneLabel" for="zone">Zone</label>
    <select id="zone"></select>

    <label id="notifyLabel" for="notify">Send notification to</label>
    <select id="notify"></select>

    <label id="countLabel">How often?</label>
    <div class="stepper">
      <button type="button" id="minus">−</button>
      <div class="n" id="count">2</div>
      <button type="button" id="plus">+</button>
      <span id="countHint" class="hint" style="margin:0">then the rule deletes itself</span>
    </div>

    <details>
      <summary id="advancedSummary">Customize text (optional)</summary>
      <label id="titleLabel" for="title">Title</label>
      <input type="text" id="title" placeholder="Location alert">
      <label id="messageLabel" for="message">Message</label>
      <input type="text" id="message" placeholder="{person} has {zone} {event}">
      <div id="placeholderHint" class="hint">Placeholders: {person}, {zone}, {event} (entered/left)</div>
      <label id="nameLabel" for="name">Rule name</label>
      <input type="text" id="name" placeholder="will be generated automatically">
    </details>

    <button class="primary" id="create">Create rule</button>
    <div class="err" id="err"></div>
  </div>

  <h2 id="activeTitle">Active</h2>
  <div id="active"></div>

  <h2 id="doneHead">Completed <button class="link" id="clearDone">remove all</button></h2>
  <div id="done"></div>

  <h2 id="logTitle">History</h2>
  <div class="card log" id="log"></div>
</div>

<script>
const translations = {
  de: {
    title: "Standort-Alarme",
    pageTitle: "📍 Standort-Alarme",
    entityLabel: "Wenn dieses Gerät / diese Person …",
    eventLabel: "… folgendes tut",
    zoneLabel: "Zone",
    notifyLabel: "Benachrichtigung senden an",
    countLabel: "Wie oft?",
    countHint: "danach löscht sich die Regel selbst",
    advancedSummary: "Text anpassen (optional)",
    titleLabel: "Titel",
    messageLabel: "Nachricht",
    placeholderHint: "Platzhalter: {person}, {zone}, {event} (betreten/verlassen)",
    nameLabel: "Name der Regel",
    createRule: "Regel erstellen",
    activeTitle: "Aktiv",
    completed: "Erledigt",
    removeAll: "alle entfernen",
    logTitle: "Verlauf",
    emptyActive: "Keine aktiven Regeln",
    emptyLog: "Noch nichts passiert",
    noDevices: "Keine Geräte gefunden",
    noZones: "Keine Zonen gefunden",
    noNotify: "Keine Notify-Dienste gefunden",
    eventEnter: "betritt",
    eventLeave: "verlässt",
    statusDone: "fertig",
    statusPaused: "pausiert",
    statusRemaining: "noch {remaining}× von {total}",
    resume: "▶ Fortsetzen",
    pause: "⏸ Pausieren",
    sendTest: "Test senden",
    sent: "Gesendet ✓",
    delete: "Löschen",
    errorSelect: "Bitte alle Felder auswählen.",
    haUnavailable: "Home Assistant nicht erreichbar: {message}",
    footerLast: "Zuletzt: {time}",
    noCompletedRules: "Keine erledigten Regeln",
    titlePlaceholder: "Standort-Alarm",
    messagePlaceholder: "{person} hat {zone} {event}",
    namePlaceholder: "wird automatisch erzeugt",
  },
  en: {
    title: "Location alerts",
    pageTitle: "📍 Location alerts",
    entityLabel: "If this device/person …",
    eventLabel: "… does the following",
    zoneLabel: "Zone",
    notifyLabel: "Send notification to",
    countLabel: "How often?",
    countHint: "then the rule deletes itself",
    advancedSummary: "Customize text (optional)",
    titleLabel: "Title",
    messageLabel: "Message",
    placeholderHint: "Placeholders: {person}, {zone}, {event} (entered/left)",
    nameLabel: "Rule name",
    createRule: "Create rule",
    activeTitle: "Active",
    completed: "Completed",
    removeAll: "remove all",
    logTitle: "History",
    emptyActive: "No active rules",
    emptyLog: "Nothing happened yet",
    noDevices: "No devices found",
    noZones: "No zones found",
    noNotify: "No notify services found",
    eventEnter: "enters",
    eventLeave: "leaves",
    statusDone: "done",
    statusPaused: "paused",
    statusRemaining: "{remaining} of {total} left",
    resume: "▶ Resume",
    pause: "⏸ Pause",
    sendTest: "Send test",
    sent: "Sent ✓",
    delete: "Delete",
    errorSelect: "Please select all fields.",
    haUnavailable: "Home Assistant is not reachable: {message}",
    footerLast: "Last: {time}",
    noCompletedRules: "No completed rules",
    titlePlaceholder: "Location alert",
    messagePlaceholder: "{person} has {zone} {event}",
    namePlaceholder: "will be generated automatically",
  }
};

function detectLocale() {
  try {
    const parentLang = window.parent && window.parent.document && window.parent.document.documentElement
      ? window.parent.document.documentElement.lang
      : "";
    const raw = (parentLang || navigator.language || navigator.userLanguage || "").toLowerCase();
    if (raw.startsWith("de")) return "de";
  } catch (e) {
    // Ignore cross-origin restrictions; default to English.
  }
  return "en";
}

const locale = detectLocale();
const $ = (id) => document.getElementById(id);
let opts = { entities: [], zones: [], notify: [] };
let event = "enter";
let count = 2;

function t(key, vars = {}) {
  const map = translations[locale] || translations.en;
  const text = map[key] || translations.en[key] || key;
  return Object.entries(vars).reduce((result, [k, v]) => result.replaceAll(`{${k}}`, String(v)), text);
}

function applyTranslations() {
  document.documentElement.lang = locale;
  document.title = t("title");
  $("pageTitle").textContent = t("pageTitle");
  $("entityLabel").textContent = t("entityLabel");
  $("eventLabel").textContent = t("eventLabel");
  $("zoneLabel").textContent = t("zoneLabel");
  $("notifyLabel").textContent = t("notifyLabel");
  $("countLabel").textContent = t("countLabel");
  $("countHint").textContent = t("countHint");
  $("advancedSummary").textContent = t("advancedSummary");
  $("titleLabel").textContent = t("titleLabel");
  $("messageLabel").textContent = t("messageLabel");
  $("placeholderHint").textContent = t("placeholderHint");
  $("nameLabel").textContent = t("nameLabel");
  $("create").textContent = t("createRule");
  $("activeTitle").textContent = t("activeTitle");
  $("doneHead").firstChild.textContent = `${t("completed")} `;
  $("clearDone").textContent = t("removeAll");
  $("logTitle").textContent = t("logTitle");

  $("title").setAttribute("placeholder", t("titlePlaceholder"));
  $("message").setAttribute("placeholder", t("messagePlaceholder"));
  $("name").setAttribute("placeholder", t("namePlaceholder"));

  document.querySelectorAll("#eventSeg button").forEach((b) => {
    b.textContent = b.dataset.v === "enter" ? t("eventEnter") : t("eventLeave");
  });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function api(path, method = "GET", body) {
  const headers = { "X-Language": locale };
  if (body) headers["Content-Type"] = "application/json";
  const res = await fetch(path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function fillSelect(sel, items, empty) {
  sel.textContent = "";
  if (!items.length) {
    const o = el("option", "", empty);
    o.value = "";
    sel.appendChild(o);
    return;
  }
  items.forEach((i) => {
    const o = el("option", "", i.name);
    o.value = i.id;
    sel.appendChild(o);
  });
}

function selectedName(sel) {
  return sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : "";
}

function fmtTime(ts) {
  if (!ts) return "";
  const date = new Date(ts * 1000);
  const formatter = new Intl.DateTimeFormat(locale === "de" ? "de-DE" : "en-US", {
    day: "2-digit",
    month: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
  });
  return formatter.format(date);
}

function ruleCard(r) {
  const done = r.remaining <= 0;
  const paused = !done && r.enabled === false;
  const card = el("div", "rule" + (done ? " done" : "") + (paused ? " paused" : ""));
  const top = el("div", "rule-top");
  const left = el("div");
  left.appendChild(el("div", "rule-name", r.name));
  const verb = r.event === "enter" ? t("eventEnter") : t("eventLeave");
  left.appendChild(el("div", "rule-sub", `${r.entity_name} ${verb} ${r.zone_name} → ${r.notify_name}`));
  if (r.last_triggered) left.appendChild(el("div", "rule-sub", t("footerLast", { time: fmtTime(r.last_triggered) })));
  top.appendChild(left);
  const badge = el(
    "div",
    "badge" + (done ? " done" : paused ? " paused" : ""),
    done ? t("statusDone") : paused ? t("statusPaused") : t("statusRemaining", { remaining: r.remaining, total: r.total })
  );
  top.appendChild(badge);
  card.appendChild(top);

  const actions = el("div", "actions");
  if (!done) {
    const toggle = el("button", "", paused ? t("resume") : t("pause"));
    toggle.onclick = async () => render(await api(`api/rules/${r.id}/toggle`, "POST"));
    actions.appendChild(toggle);
  }
  const test = el("button", "", t("sendTest"));
  test.onclick = async () => {
    try { await api(`api/rules/${r.id}/test`, "POST"); test.textContent = t("sent"); }
    catch (e) { alert(e.message); }
  };
  actions.appendChild(test);
  const del = el("button", "del", t("delete"));
  del.onclick = async () => render(await api(`api/rules/${r.id}`, "DELETE"));
  actions.appendChild(del);
  card.appendChild(actions);
  return card;
}

function render(state) {
  const active = $("active"), done = $("done"), log = $("log");
  active.textContent = ""; done.textContent = ""; log.textContent = "";
  const a = state.rules.filter((r) => r.remaining > 0);
  const d = state.rules.filter((r) => r.remaining <= 0);
  if (!a.length) active.appendChild(el("div", "empty", t("emptyActive")));
  a.forEach((r) => active.appendChild(ruleCard(r)));
  d.forEach((r) => done.appendChild(ruleCard(r)));
  $("doneHead").style.display = d.length ? "" : "none";
  if (!state.log.length) log.appendChild(el("div", "", t("emptyLog")));
  state.log.slice(0, 15).forEach((l) => log.appendChild(el("div", "", `${fmtTime(l.ts)} – ${l.text}`)));
}

async function refresh() {
  try { render(await api("api/rules")); } catch (e) { /* retry next time */ }
}

async function init() {
  applyTranslations();
  try {
    opts = await api("api/options");
  } catch (e) {
    $("err").textContent = t("haUnavailable", { message: e.message });
  }
  fillSelect($("entity"), opts.entities, t("noDevices"));
  fillSelect($("zone"), opts.zones, t("noZones"));
  fillSelect($("notify"), opts.notify, t("noNotify"));
  await refresh();
  setInterval(refresh, 5000);
}

document.querySelectorAll("#eventSeg button").forEach((b) => {
  b.onclick = () => {
    event = b.dataset.v;
    document.querySelectorAll("#eventSeg button").forEach((x) => x.classList.toggle("on", x === b));
  };
});
$("minus").onclick = () => { count = Math.max(1, count - 1); $("count").textContent = count; };
$("plus").onclick = () => { count = Math.min(99, count + 1); $("count").textContent = count; };

$("create").onclick = async () => {
  $("err").textContent = "";
  const entity = $("entity").value, zone = $("zone").value, notify = $("notify").value;
  if (!entity || !zone || !notify) { $("err").textContent = t("errorSelect"); return; }
  $("create").disabled = true;
  try {
    const state = await api("api/rules", "POST", {
      entity, entity_name: selectedName($("entity")),
      zone, zone_name: selectedName($("zone")),
      notify, notify_name: selectedName($("notify")),
      event, count,
      title: $("title").value, message: $("message").value, name: $("name").value,
    });
    render(state);
    $("name").value = ""; $("message").value = ""; $("title").value = "";
  } catch (e) {
    $("err").textContent = e.message;
  } finally {
    $("create").disabled = false;
  }
};

$("clearDone").onclick = async () => render(await api("api/clear-done", "POST"));

init();
</script>
</body>
</html>
