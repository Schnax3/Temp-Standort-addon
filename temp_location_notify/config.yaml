name: "Standort-Alarme (temporär)"
version: "1.0.1"
slug: temp_location_notify
description: "Temporäre Standort-Benachrichtigungen mit Zähler – ohne Automationen, die man später löschen muss."

arch:
  - aarch64

init: false
startup: application
boot: auto

ingress: true
ingress_port: 8099

panel_icon: mdi:bell-ring
panel_title: Standort-Alarme
panel_admin: false

homeassistant_api: true

build:
  dockerfile: Dockerfile
  args:
    BUILD_FROM: "ghcr.io/home-assistant/aarch64-base:3.21"